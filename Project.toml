# FastGaussQuadrature and QuadGK are hard runtime dependencies; QuadGK drives
# ThermalModel's reference mass integral. Plots remains figure-only.

[deps]
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
FastGaussQuadrature = "442a2c76-b920-505d-bb47-c5924d526838"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
QuadGK = "1fd47b50-473d-5c70-9696-f719f8f3bcdc"
SHA = "ea8e919c-243c-51af-8825-aaa63cd721ce"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"

[compat]
FastGaussQuadrature = "1"
Plots = "1"
QuadGK = "2"
# CascadeTables.buildkeys! needs `Threads.@threads :greedy` (Julia 1.11+) and
# `OncePerTask` (1.12+), which gives each of that loop's tasks its own row
# buffers — the loop exposes no task index, so there is no earlier equivalent.
julia = "1.12"

[extras]
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Logging", "Test"]
