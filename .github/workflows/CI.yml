name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'      # minimum supported (OncePerTask in buildkeys!)
      - uses: julia-actions/cache@v2
      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        env:
          JULIA_NUM_THREADS: auto
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  heavy-flavour-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-heavy-flavour.txt
      - name: Test generator helpers and checked-in supplement
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install pinned PDG data API
        run: python -m pip install -r tools/requirements-heavy-flavour.txt
      - name: Check generated supplement
        run: python tools/gen_heavy_flavour.py --check
